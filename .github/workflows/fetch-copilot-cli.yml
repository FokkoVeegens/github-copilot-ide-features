name: Fetch GitHub Copilot CLI release notes

on:
  schedule:
    # Daily at 07:11 UTC
    - cron: '11 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub Copilot CLI release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.run --ide copilot-cli

      - name: Commit new files
        if: github.ref == 'refs/heads/main'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/copilot-cli/
          commit-message: "chore(copilot-cli): add new release notes"
          branch: bot/fetch-copilot-cli
          delete-branch: true
          title: "chore(copilot-cli): add new release notes"
          body: "Automated update: new release notes fetched by the daily workflow."

      - name: Enable auto-merge
        if: github.ref == 'refs/heads/main' && steps.create-pr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulate commit (non-default branch)
        if: github.ref != 'refs/heads/main'
        run: |
          git add data/copilot-cli/
          if git diff --staged --quiet; then
            echo "No new releases — nothing to commit."
          else
            echo "Running on non-default branch (${{ github.ref_name }}) — skipping commit."
            echo "Files that would have been committed:"
            git diff --staged --name-only
          fi
