name: Fetch Eclipse release notes

on:
  schedule:
    # Daily at 06:17 UTC
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Eclipse release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.run --ide eclipse

      - name: Commit new files
        if: github.ref == 'refs/heads/main'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/eclipse/
          commit-message: "chore(eclipse): add new release notes"
          branch: bot/fetch-eclipse
          delete-branch: true
          title: "chore(eclipse): add new release notes"
          body: "Automated update: new release notes fetched by the daily workflow."

      - name: Enable auto-merge
        if: github.ref == 'refs/heads/main' && steps.create-pr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulate commit (non-default branch)
        if: github.ref != 'refs/heads/main'
        run: |
          git add data/eclipse/
          if git diff --staged --quiet; then
            echo "No new releases — nothing to commit."
          else
            echo "Running on non-default branch (${{ github.ref_name }}) — skipping commit."
            echo "Files that would have been committed:"
            git diff --staged --name-only
          fi
