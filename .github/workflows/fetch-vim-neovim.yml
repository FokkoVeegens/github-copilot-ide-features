name: Fetch Vim/Neovim release notes

on:
  schedule:
    # Daily at 06:47 UTC
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Vim/Neovim release notes
        run: python -m scripts.run --ide vim-neovim

      - name: Commit new files
        if: github.ref == 'refs/heads/main'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/vim-neovim/
          commit-message: "chore(vim-neovim): add new release notes"
          branch: bot/fetch-vim-neovim
          delete-branch: true
          title: "chore(vim-neovim): add new release notes"
          body: "Automated update: new release notes fetched by the daily workflow."

      - name: Enable auto-merge
        if: github.ref == 'refs/heads/main' && steps.create-pr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulate commit (non-default branch)
        if: github.ref != 'refs/heads/main'
        run: |
          git add data/vim-neovim/
          if git diff --staged --quiet; then
            echo "No new releases — nothing to commit."
          else
            echo "Running on non-default branch (${{ github.ref_name }}) — skipping commit."
            echo "Files that would have been committed:"
            git diff --staged --name-only
          fi
